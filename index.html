<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Two Dynamic Name Lists</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .container {
      display: flex;
      gap: 40px;
    }

    .list-block {
      flex: 1;
    }

    ul {
      padding-left: 20px;
    }

    button {
      margin-bottom: 20px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Dynamic Name Lists</h1>
  <button id="generateButton">Generate 2×25 Names</button>

  <div class="container">
    <div class="list-block">
      <h2>List A</h2>
      <ul id="listA"></ul>
    </div>
    <div class="list-block">
      <h2>List B</h2>
      <ul id="listB"></ul>
    </div>
  </div>

  <script>
    const baseNames = [
      "Alice", "Bob", "Charlie", "Diana", "Ethan",
      "Fiona", "George", "Hannah", "Ian", "Julia",
      "Kevin", "Laura", "Mike", "Nina", "Oscar",
      "Paula", "Quentin", "Rachel", "Sam", "Tina",
      "Ursula", "Victor", "Wendy", "Xavier", "Yvonne",
      "Zack"
    ];

    function getRandomName() {
      const index = Math.floor(Math.random() * baseNames.length);
      return baseNames[index];
    }

    function fillList(elementId, count) {
      const ul = document.getElementById(elementId);
      ul.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const li = document.createElement("li");
        li.textContent = getRandomName();
        ul.appendChild(li);
      }
    }

    document.getElementById("generateButton").addEventListener("click", function () {
      fillList("listA", 25);
      fillList("listB", 25);
    });

    window.addEventListener("load", function () {
      fillList("listA", 25);
      fillList("listB", 25);
    });
  </script>
</body>
</html>
